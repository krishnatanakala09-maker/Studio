
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOKSHA Video Generator</title>
<style>
*{box-sizing:border-box}
body{background:#090b12;color:white;font-family:Arial;padding:18px}
h1{color:#a78bfa}
p{color:#a5abc0}
label{display:block;margin:20px 0 8px}
textarea,select,input{
width:100%;padding:13px;background:#171c2b;
color:white;border:1px solid #343b50;border-radius:9px
}
textarea{height:120px}
button{background:#7955e9;color:white;border:0;
padding:14px;border-radius:9px;margin-top:15px;font-weight:bold}
.preview{margin-top:20px;padding:15px;background:#171c2b;border-radius:12px}
img,video{width:100%;border-radius:10px;margin-top:12px}
</style>
</head>
<body>

<button onclick="location.href='index.html'">← BACK TO STUDIO</button>

<h1>MOKSHA AI</h1>
<p>VIDEO GENERATOR · MODULE 02</p>

<label>Video prompt</label>
<textarea id="prompt" placeholder="Describe the video you want to create..."></textarea>

<label>Generation mode</label>
<select id="mode">
<option>Text to Video</option>
<option>Image to Video</option>
</select>

<label>Upload reference image</label>
<input type="file" id="image" accept="image/*">

<div id="imagePreview"></div>

<label>Video duration</label>
<select id="duration">
<option>5 seconds</option>
<option>8 seconds</option>
<option>10 seconds</option>
</select>

<label>Aspect ratio</label>
<select id="ratio">
<option>9:16 - Shorts / Reels</option>
<option>16:9 - YouTube</option>
<option>1:1 - Square</option>
</select>

<label>Visual style</label>
<select id="style">
<option>Cinematic 3D</option>
<option>Anime</option>
<option>Realistic</option>
<option>2D Animation</option>
</select>

<button onclick="prepare()">PREPARE VIDEO</button>

<div class="preview" id="result">
<h3>Video Workspace</h3>
<p>Your video preview will appear here after an AI video engine is connected.</p>
</div>

<script>
const imageInput=document.getElementById("image");

imageInput.addEventListener("change",function(){
const file=this.files[0];
if(!file)return;
const url=URL.createObjectURL(file);
document.getElementById("imagePreview").innerHTML="";
const img=document.createElement("img");
img.src=url;
document.getElementById("imagePreview").appendChild(img);
});

function prepare(){
const prompt=document.getElementById("prompt").value.trim();
if(!prompt){
alert("Please enter a video prompt!");
return;
}

const settings={
prompt:prompt,
mode:document.getElementById("mode").value,
duration:document.getElementById("duration").value,
ratio:document.getElementById("ratio").value,
style:document.getElementById("style").value
};

const result=document.getElementById("result");
result.innerHTML="<h3>Video Job Prepared ✓</h3>";

const details=document.createElement("pre");
details.style.whiteSpace="pre-wrap";
details.style.color="#c4b5fd";
details.textContent=JSON.stringify(settings,null,2);
result.appendChild(details);

const copy=document.createElement("button");
copy.textContent="COPY VIDEO SETTINGS";
copy.onclick=()=>navigator.clipboard.writeText(JSON.stringify(settings,null,2));
result.appendChild(copy);

const note=document.createElement("p");
note.textContent="AI video engine is not connected yet. This prepares your settings but does not generate a video.";
result.appendChild(note);
}
</script>
</body>
</html>
